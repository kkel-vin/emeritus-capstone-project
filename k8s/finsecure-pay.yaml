apiVersion: v1
kind: Service
metadata:
  name: finsecure-pay
  labels:
    app: finsecure-pay
spec:
  type: LoadBalancer
  selector:
    app: finsecure-pay
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: finsecure-pay-config
data:
  VALIDATION_MAX_AMOUNT: "10000.00"
  VALIDATION_SUPPORTED_CCY: "IDR,SGD,USD,EUR"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-pay
  labels:
    app: finsecure-pay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finsecure-pay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: finsecure-pay
    spec:
      containers:
        - name: finsecure-pay
          image: kelvinking0318/finsecure-pay:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: finsecure-pay-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi