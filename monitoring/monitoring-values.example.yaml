# copy to monitoring-values.yaml, fill in your addresses, and create the alertmanager-smtp secret first
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-smtp
  config:
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'sender@example.com'
      smtp_auth_username: 'sender@example.com'
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
      smtp_require_tls: true
    route:
      receiver: 'null'
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      routes:
        - receiver: email
          matchers:
            - alertname = "FinSecurePayLowReplicas"
    receivers:
      - name: 'null'
      - name: email
        email_configs:
          - to: 'alerts@example.com'
            send_resolved: true